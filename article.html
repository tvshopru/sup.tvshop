<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Статья • TV SHOP</title>
    <meta name="description" content="Инструкции, руководства и полезные статьи от TV SHOP">
    <link rel="icon" type="image/png" href="app_logo.png?v=2">

    <!-- Open Graph for Telegram & Social previews -->
    <meta property="og:site_name" content="TV SHOP">
    <meta property="og:type" content="article">
    <meta property="og:title" id="og-title" content="Статья TV SHOP">
    <meta property="og:description" id="og-desc" content="Полезное руководство и настройка">
    <meta property="og:image" content="app_logo.png">

    <!-- Unified Article Engine -->
    <link rel="stylesheet" href="css/article.css">
    <script src="js/article-renderer.js"></script>

    <style>
        :root {
            --bg-color: #ffffff;
            --bg-secondary: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #111827;
            --text-secondary: #4b5563;
            --text-muted: #9ca3af;
            --accent-color: #2481cc;
            --accent-hover: #1b66a3;
            --accent-light: #e8f4fd;
            --border-color: #e5e7eb;
            --code-bg: #f3f4f6;
            --code-text: #1f2937;
            --quote-bg: #f0f7ff;
            --quote-border: #2481cc;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 14px rgba(0,0,0,0.08);
            --header-bg: rgba(255, 255, 255, 0.85);
        }

        body.dark-theme {
            --bg-color: #0f141c;
            --bg-secondary: #171f2b;
            --card-bg: #171f2b;
            --text-primary: #f3f4f6;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --accent-color: #00b4d8;
            --accent-hover: #0096c7;
            --accent-light: rgba(0, 180, 216, 0.12);
            --border-color: #243042;
            --code-bg: #1e293b;
            --code-text: #38bdf8;
            --quote-bg: rgba(0, 180, 216, 0.08);
            --quote-border: #00b4d8;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.4);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.4);
            --header-bg: rgba(15, 20, 28, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 17px;
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        /* Top Bar */
        .top-navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            background: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-link {
            display: flex;
            align-items: center;
            text-decoration: none;
            flex-shrink: 0;
        }

        .brand-link img {
            width: 30px;
            height: 30px;
            border-radius: 6px;
            object-fit: contain;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: 16px;
            padding: 4px 9px;
            font-size: 0.8em;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            white-space: nowrap;
            transition: all 0.2s;
            line-height: 1.2;
        }

        .nav-btn:hover {
            background: var(--accent-light);
            color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .nav-btn-icon {
            width: 30px;
            height: 30px;
            padding: 0;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* Main Container (Telegraph Max Width) */
        .article-container {
            width: 100%;
            max-width: 740px;
            margin: 0 auto;
            padding: 36px 20px 80px 20px;
            flex: 1;
        }

        /* Article Meta Header */
        .article-header {
            margin-bottom: 30px;
            padding-bottom: 22px;
            border-bottom: 1px solid var(--border-color);
        }

        .article-title {
            font-size: 2.2em;
            font-weight: 800;
            line-height: 1.25;
            color: var(--text-primary);
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        @media (max-width: 600px) {
            .article-title {
                font-size: 1.75em;
            }
            .article-container {
                padding-top: 24px;
            }
        }

        .article-meta-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 0.9em;
            color: var(--text-muted);
        }

        .author-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--accent-color);
            font-weight: 700;
            text-decoration: none;
        }

        .author-badge:hover {
            text-decoration: underline;
        }

        .meta-dot {
            opacity: 0.5;
        }

        /* Video Action Banner */
        .video-banner-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--accent-light);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            border-radius: 12px;
            padding: 14px 20px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1em;
            margin-bottom: 28px;
            transition: all 0.2s;
        }

        .video-banner-btn:hover {
            background: var(--accent-color);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(36, 129, 204, 0.3);
        }

        /* Content Body Typography */
        .article-body {
            color: var(--text-primary);
            font-size: 1.06em;
            line-height: 1.75;
            word-wrap: break-word;
        }

        .article-body p {
            margin-bottom: 1.3em;
        }

        .article-body h1, .article-body h2, .article-body h3, .article-body h4 {
            color: var(--text-primary);
            font-weight: 800;
            line-height: 1.3;
            margin: 1.6em 0 0.6em 0;
        }

        .article-body h2 {
            font-size: 1.45em;
            margin: 1.4em 0 0.6em 0;
        }

        .article-body h3 {
            font-size: 1.25em;
        }

        .article-body a {
            color: var(--accent-color);
            text-decoration: underline;
            text-underline-offset: 3px;
            word-break: break-all;
        }

        .article-body a:hover {
            color: var(--accent-hover);
        }

        .article-body blockquote, blockquote.article-quote-block {
            border-left: 4px solid var(--accent-color) !important;
            background: rgba(36, 129, 204, 0.08) !important;
            padding: 12px 18px !important;
            margin: 16px 0 !important;
            border-radius: 0 10px 10px 0 !important;
            font-style: normal !important;
            font-weight: 500;
            line-height: 1.6;
            color: var(--text-primary);
        }

        body.dark-theme .article-body blockquote, body.dark-theme blockquote.article-quote-block {
            background: rgba(0, 180, 216, 0.1) !important;
            border-left-color: var(--accent-color) !important;
        }

        .article-body blockquote p, blockquote.article-quote-block p {
            margin: 0 !important;
        }

        .article-body blockquote cite, blockquote.article-quote-block cite {
            display: block;
            margin-top: 8px;
            font-size: 0.85em;
            color: var(--text-secondary);
            font-style: normal;
        }

        .article-body mark, .tg-text-highlight, span.tg-text-highlight {
            background-color: #dbeafe !important;
            color: #0369a1 !important;
            padding: 2px 6px !important;
            border-radius: 4px !important;
            font-weight: 600 !important;
        }

        .tg-highlight-box {
            background: #e0f2fe !important;
            border-left: 4px solid #0284c7 !important;
            color: #0369a1 !important;
            padding: 10px 14px !important;
            border-radius: 0 8px 8px 0 !important;
            margin: 12px 0 !important;
            font-weight: 600 !important;
            line-height: 1.5 !important;
        }

        .article-body u {
            text-decoration: underline !important;
            text-underline-offset: 3px !important;
        }

        .article-body ul {
            margin: 0.8em 0 !important;
            padding-left: 8px !important;
            list-style: disc inside !important;
            list-style-type: disc !important;
            list-style-position: inside !important;
            display: block !important;
        }

        .article-body ol {
            margin: 0.8em 0 !important;
            padding-left: 8px !important;
            list-style: decimal inside !important;
            list-style-type: decimal !important;
            list-style-position: inside !important;
            display: block !important;
        }

        .article-body ul > li {
            display: list-item !important;
            list-style: disc inside !important;
            list-style-type: disc !important;
            list-style-position: inside !important;
            margin-bottom: 0.35em !important;
            line-height: 1.5 !important;
        }

        .article-body ol > li {
            display: list-item !important;
            list-style: decimal inside !important;
            list-style-type: decimal !important;
            list-style-position: inside !important;
            margin-bottom: 0.35em !important;
            line-height: 1.5 !important;
        }

        .article-body ul > li::marker {
            color: var(--accent-color) !important;
            font-size: 1.1em !important;
        }

        .article-body ul > li::marker {
            color: var(--accent-color) !important;
            font-size: 1.2em !important;
        }

        .article-body pre, .article-body code {
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            background: var(--code-bg);
            color: var(--code-text);
            border-radius: 6px;
            font-size: 0.9em;
        }

        .article-body code {
            padding: 2px 6px;
        }

        .article-body pre {
            padding: 16px;
            margin: 1.4em 0;
            overflow-x: auto;
            white-space: pre-wrap;
            border: 1px solid var(--border-color);
        }

        .article-body hr {
            border: none;
            height: 1px;
            background: var(--border-color);
            margin: 2.2em 0;
        }

        .article-body img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            margin: 18px 0;
            display: block;
            cursor: zoom-in;
            box-shadow: var(--shadow-md);
            transition: transform 0.2s ease;
        }

        .article-body img:hover {
            transform: scale(1.008);
        }

        .article-body b, .article-body strong {
            font-weight: 700;
        }

        .article-body s, .article-body del {
            text-decoration: line-through;
            opacity: 0.65;
        }

        /* Remote Control Key Badge */
        .tv-remote-key, kbd.tv-remote-key, .article-body kbd {
            display: inline-block;
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #0f172a;
            border-bottom: 2.5px solid #020617;
            border-radius: 5px;
            padding: 2px 7px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 0.82em;
            font-weight: 800;
            letter-spacing: 0.5px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
            vertical-align: baseline;
            margin: 0 2px;
        }

        body.dark-theme .tv-remote-key, body.dark-theme kbd.tv-remote-key, body.dark-theme .article-body kbd {
            background: #334155;
            color: #38bdf8;
            border-color: #1e293b;
            border-bottom-color: #0f172a;
        }

        /* Call-to-Action Buttons */
        .article-btn-wrapper {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        .article-btn-cta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--accent-color);
            color: #ffffff !important;
            text-decoration: none !important;
            padding: 13px 28px;
            border-radius: 26px;
            font-weight: 700;
            font-size: 1.02em;
            transition: all 0.2s;
            box-shadow: 0 4px 14px rgba(36, 129, 204, 0.35);
        }

        .article-btn-cta:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(36, 129, 204, 0.45);
        }

        /* Alert / Warning Cards */
        .article-alert-card {
            background: #fffbeb;
            border-left: 4px solid #f59e0b;
            border-radius: 0 10px 10px 0;
            padding: 14px 18px;
            margin: 18px 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        body.dark-theme .article-alert-card {
            background: rgba(245, 158, 11, 0.12);
            border-left-color: #fbbf24;
        }

        .article-alert-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            color: #b45309;
        }

        body.dark-theme .article-alert-header {
            color: #fbbf24;
        }

        .article-alert-body {
            font-size: 0.96em;
            color: #92400e;
            line-height: 1.55;
        }

        body.dark-theme .article-alert-body {
            color: #fde68a;
        }

        /* Spoiler / Accordion (FAQ) */
        .article-spoiler-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin: 16px 0;
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .article-spoiler-card[open] {
            border-color: var(--accent-color);
        }

        .article-spoiler-header {
            padding: 14px 18px;
            font-weight: 700;
            font-size: 1.02em;
            cursor: pointer;
            user-select: none;
            background: rgba(0,0,0,0.02);
            list-style-position: inside;
        }

        .article-spoiler-content {
            padding: 16px 18px;
            border-top: 1px solid var(--border-color);
            font-size: 0.98em;
            line-height: 1.65;
        }

        /* Video Embeds */
        .article-embed-wrapper {
            margin: 22px 0;
        }

        .article-embed-responsive {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 ratio */
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: var(--shadow-md);
        }

        .article-embed-responsive iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .article-embed-caption, .article-image-caption {
            font-size: 0.85em;
            color: var(--text-muted);
            margin-top: 8px;
            text-align: center;
            font-style: italic;
        }

        /* Tables & Checklists */
        .article-table-responsive {
            overflow-x: auto;
            margin: 18px 0;
        }

        .article-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95em;
        }

        .article-table th, .article-table td {
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            text-align: left;
        }

        .article-table th {
            background: var(--bg-secondary);
            font-weight: 700;
        }

        .article-checklist-list {
            list-style: none !important;
            padding-left: 0 !important;
            margin: 14px 0 !important;
        }

        .article-checklist-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .article-checklist-item.checked {
            text-decoration: line-through;
            opacity: 0.6;
        }

        /* Footer & Channel promo */
        .article-footer {
            margin-top: 36px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .footer-channel-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: nowrap;
        }

        .footer-channel-info {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .footer-channel-info img {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            object-fit: contain;
            background: #fff;
            padding: 2px;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .footer-channel-name {
            font-weight: 700;
            font-size: 0.9em;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tg-join-btn {
            background: #2481cc;
            color: #ffffff !important;
            padding: 6px 14px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 0.82em;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        .tg-join-btn:hover {
            background: #1b66a3;
        }

        /* Lightbox Fullscreen */
        .lightbox-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 99999;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: zoom-out;
            padding: 20px;
        }

        .lightbox-overlay.active {
            display: flex;
        }

        .lightbox-img {
            max-width: 96%;
            max-height: 94%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .lightbox-close:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Loading & Error States */
        .loading-state, .error-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            margin: 0 auto 16px auto;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <header class="top-navbar">
        <a href="index.html" class="brand-link" title="На главную TV SHOP">
            <img src="app_logo.png?v=2" alt="TV SHOP Logo">
        </a>
        <div class="nav-actions">
            <a href="articles.html" class="nav-btn" title="Каталог всех статей и инструкций">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                <span>Все статьи</span>
            </a>
            <button class="nav-btn nav-btn-icon" id="theme-toggle-btn" title="Сменить тему (День/Ночь)">
                <svg id="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;display:none;">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg id="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
            <button class="nav-btn" id="share-btn" title="Поделиться статьей">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;">
                    <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
                    <polyline points="16 6 12 2 8 6"></polyline>
                    <line x1="12" y1="2" x2="12" y2="15"></line>
                </svg>
                <span>Поделиться</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="article-container" id="main-container">
        <div class="loading-state" id="loading-state">
            <div class="spinner"></div>
            <div>Загрузка статьи...</div>
        </div>
    </main>

    <!-- Fullscreen Lightbox -->
    <div class="lightbox-overlay" id="lightbox-overlay">
        <div class="lightbox-close" id="lightbox-close">&times;</div>
        <img class="lightbox-img" id="lightbox-img" alt="Zoomed view">
    </div>

    <script>
        // Theme Management
        (function initTheme() {
            var savedTheme = localStorage.getItem('article-theme') || 'light';
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-theme');
                updateThemeIcons(true);
            } else {
                document.body.classList.remove('dark-theme');
                updateThemeIcons(false);
            }
        })();

        function updateThemeIcons(isDark) {
            var sun = document.getElementById('theme-icon-sun');
            var moon = document.getElementById('theme-icon-moon');
            if (sun && moon) {
                sun.style.display = isDark ? 'block' : 'none';
                moon.style.display = isDark ? 'none' : 'block';
            }
        }

        document.getElementById('theme-toggle-btn').addEventListener('click', function() {
            var isDark = document.body.classList.toggle('dark-theme');
            localStorage.setItem('article-theme', isDark ? 'dark' : 'light');
            updateThemeIcons(isDark);
        });

        // Query Param Helper
        function getQueryParam(name) {
            var match = RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
            return match && decodeURIComponent(match[1].replace(/\+/g, ' '));
        }

        // Fetch Config and Render
        var targetArtId = getQueryParam('id') || getQueryParam('art');

        fetch('config.json?v=' + Date.now())
            .then(function(res) {
                if (!res.ok) throw new Error('Не удалось загрузить конфигурацию');
                return res.json();
            })
            .then(function(config) {
                renderArticle(config, targetArtId);
            })
            .catch(function(err) {
                document.getElementById('main-container').innerHTML = 
                    '<div class="error-state">' +
                        '<h2>Ошибка загрузки</h2>' +
                        '<p style="margin-top:8px;">' + (err.message || 'Статья недоступна') + '</p>' +
                        '<a href="index.html" class="nav-btn" style="margin-top:20px; display:inline-flex;">← На главную</a>' +
                    '</div>';
            });

        function renderArticle(config, artId) {
            var container = document.getElementById('main-container');
            var articles = config.articles || [];
            
            var article = null;
            if (artId) {
                article = articles.find(function(a) { return a.id === artId; });
                if (!article && !isNaN(parseInt(artId)) && String(parseInt(artId)) === String(artId)) {
                    article = articles[parseInt(artId)];
                }
            } else if (articles.length > 0) {
                // If no ID passed in URL at all, default to first article
                article = articles[0];
            }

            if (!article) {
                document.title = 'Статья не найдена • TV SHOP';
                container.innerHTML = 
                    '<div class="error-state">' +
                        '<h2>Статья не найдена</h2>' +
                        '<p style="margin-top:8px;">Возможно, ссылка устарела или статья была удалена.</p>' +
                    '</div>';
                return;
            }

            // Update Meta & Title
            var titleText = article.title || 'Статья';
            document.title = titleText + ' • TV SHOP';
            var ogTitle = document.getElementById('og-title');
            if (ogTitle) ogTitle.setAttribute('content', titleText);

            var tgContact = config.supportTg || '@android_tv_shop';
            var tgUrl = 'https://t.me/' + tgContact.replace('@', '');

            var videoBtnHtml = '';
            if (article.videoUrl) {
                videoBtnHtml = 
                    '<a href="' + escapeHtml(article.videoUrl) + '" target="_blank" class="video-banner-btn">' +
                        '<svg viewBox="0 0 24 24" fill="currentColor" style="width:22px;height:22px;"><polygon points="5 3 19 12 5 21 5 3"/></svg>' +
                        'Смотреть видеоинструкцию' +
                    '</a>';
            }

            var cleanBodyHtml = window.ArticleRenderer ? ArticleRenderer.render(article) : (article.contentHtml || '');

            var isDraft = article.status === 'draft' || article.isDraft === true || article.draft === true;
            var draftBanner = isDraft ? '<div style="background:#fef3c7; border:1px solid #fde68a; color:#92400e; padding:10px 14px; border-radius:10px; margin-bottom:18px; font-weight:700; font-size:0.9em; display:flex; align-items:center; gap:8px;"><span>🟡</span><span>Черновик статьи (в разработке)</span></div>' : '';
            var catHtml = article.category ? '<span class="meta-dot">•</span><span style="background:var(--accent-light); color:var(--accent-color); font-weight:700; padding:2px 8px; border-radius:10px; font-size:0.85em;">' + escapeHtml(article.category) + '</span>' : '';

            var html = 
                '<article>' +
                    draftBanner +
                    '<header class="article-header">' +
                        '<h1 class="article-title">' + escapeHtml(titleText) + '</h1>' +
                        '<div class="article-meta-row">' +
                            '<a href="' + tgUrl + '" target="_blank" class="author-badge">' +
                                '<svg viewBox="0 0 24 24" fill="#2481cc" style="width:18px;height:18px;"><circle cx="12" cy="12" r="12" fill="#2481cc"/><path d="M5.4 11.9l11.7-4.5c.5-.2 1.1.1 1 .7l-2 9.4c-.1.6-.7.8-1.2.5l-3.3-2.4-1.6 1.5c-.2.2-.4.3-.7.3l.2-3.4 6.2-5.6c.3-.2-.1-.4-.4-.2l-7.7 4.9-3.3-1c-.7-.2-.7-.7.1-1z" fill="#fff"/></svg>' +
                                'TV SHOP' +
                            '</a>' +
                            '<span class="meta-dot">•</span>' +
                            '<span>' + escapeHtml(article.date || 'Сегодня') + '</span>' +
                            catHtml +
                        '</div>' +
                    '</header>' +
                    videoBtnHtml +
                    '<div class="article-body">' +
                        cleanBodyHtml +
                    '</div>' +
                    '<footer class="article-footer">' +
                        '<div class="footer-channel-card">' +
                            '<div class="footer-channel-info">' +
                                '<img src="app_logo.png?v=2" alt="TV SHOP Logo">' +
                                '<div>' +
                                    '<div class="footer-channel-name">TV SHOP — Поддержка и инструкции</div>' +
                                '</div>' +
                            '</div>' +
                            '<a href="' + tgUrl + '" target="_blank" class="tg-join-btn">' +
                                '<svg viewBox="0 0 24 24" fill="currentColor" style="width:18px;height:18px;"><path d="M5.4 11.9l11.7-4.5c.5-.2 1.1.1 1 .7l-2 9.4c-.1.6-.7.8-1.2.5l-3.3-2.4-1.6 1.5c-.2.2-.4.3-.7.3l.2-3.4 6.2-5.6c.3-.2-.1-.4-.4-.2l-7.7 4.9-3.3-1c-.7-.2-.7-.7.1-1z"/></svg>' +
                                'Наш Telegram' +
                            '</a>' +
                        '</div>' +
                    '</footer>' +
                '</article>';

            container.innerHTML = html;

            // Image Lightbox zoom handler
            var images = container.querySelectorAll('.article-body img');
            images.forEach(function(img) {
                img.addEventListener('click', function() {
                    openLightbox(this.src);
                });
            });

            // Share Button
            document.getElementById('share-btn').onclick = function() {
                var shareUrl = window.location.href;
                if (navigator.share) {
                    navigator.share({
                        title: titleText,
                        url: shareUrl
                    }).catch(function() {});
                } else if (navigator.clipboard) {
                    navigator.clipboard.writeText(shareUrl).then(function() {
                        alert('Ссылка на статью скопирована в буфер обмена!');
                    });
                } else {
                    prompt('Скопируйте ссылку:', shareUrl);
                }
            };
        }

        // Lightbox Functions
        var lightboxOverlay = document.getElementById('lightbox-overlay');
        var lightboxImg = document.getElementById('lightbox-img');

        function openLightbox(src) {
            lightboxImg.src = src;
            lightboxOverlay.classList.add('active');
        }

        function closeLightbox() {
            lightboxOverlay.classList.remove('active');
            lightboxImg.src = '';
        }

        lightboxOverlay.addEventListener('click', closeLightbox);
        document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeLightbox();
        });

        function cleanArticleBody(html) {
            if (!html) return '';
            var temp = document.createElement('div');
            temp.innerHTML = html;
            var placeholders = temp.querySelectorAll('.tg-photo-placeholder, .tg-img-hover-actions');
            placeholders.forEach(function(el) { el.remove(); });
            var wrappers = temp.querySelectorAll('.tg-img-wrapper');
            wrappers.forEach(function(w) {
                var img = w.querySelector('img');
                if (img) w.replaceWith(img);
            });
            var imgs = temp.querySelectorAll('img');
            imgs.forEach(function(img) {
                var src = img.getAttribute('src') || '';
                src = src.replace(/^https?:\/\/[^\/]+\/(img\/[^\s"']+)/i, '$1');
                src = src.replace(/^https?:\/\/[^\/]+:?\d*\/(img\/[^\s"']+)/i, '$1');
                img.setAttribute('src', src);
                img.removeAttribute('title');
            });
            var captions = temp.querySelectorAll('.tg-img-caption');
            captions.forEach(function(el) {
                var txt = el.textContent.trim();
                if (!txt || txt === 'Подпись' || txt === 'Подпись к фото...') {
                    el.remove();
                }
            });
            var lis = temp.querySelectorAll('li');
            lis.forEach(function(li) {
                var txt = li.textContent.trim();
                if (!txt && !li.querySelector('img, span, strong, b, a')) {
                    li.remove();
                }
            });
            var lists = temp.querySelectorAll('ol, ul');
            lists.forEach(function(l) {
                if (!l.querySelector('li')) {
                    l.remove();
                }
            });
            return temp.innerHTML;
        }

        function renderBlocksToHtml(blocksData) {
            if (!blocksData || !blocksData.blocks || !Array.isArray(blocksData.blocks)) {
                return '';
            }

            var htmlParts = [];
            var runningOrderedIndex = 1;

            blocksData.blocks.forEach(function(block) {
                var type = block.type;
                var data = block.data || {};

                switch (type) {
                    case 'header': {
                        var level = data.level || 2;
                        var text = data.text || '';
                        htmlParts.push('<h' + level + '>' + text + '</h' + level + '>');
                        break;
                    }
                    case 'paragraph': {
                        var text = data.text || '';
                        if (text.trim()) {
                            htmlParts.push('<p>' + text + '</p>');
                        }
                        break;
                    }
                    case 'list': {
                        var isOrdered = data.style === 'ordered';
                        var tag = isOrdered ? 'ol' : 'ul';
                        var startAttr = isOrdered ? ' start="' + runningOrderedIndex + '"' : '';
                        var items = data.items || [];
                        var lis = items.map(function(item) {
                            var itemText = typeof item === 'string' ? item : (item.content || item.text || '');
                            if (isOrdered) {
                                runningOrderedIndex++;
                            }
                            return '<li>' + itemText + '</li>';
                        }).join('');
                        htmlParts.push('<' + tag + startAttr + '>' + lis + '</' + tag + '>');
                        break;
                    }
                    case 'image': {
                        var url = (data.file && data.file.url) ? data.file.url : (data.url || '');
                        var caption = data.caption || '';
                        var withBorder = data.withBorder ? ' img-bordered' : '';
                        var stretched = data.stretched ? ' img-stretched' : '';
                        var withBg = data.withBackground ? ' img-with-bg' : '';
                        
                        var imgHtml = '<div class="article-image-figure' + withBorder + stretched + withBg + '">';
                        imgHtml += '<img src="' + escapeHtml(url) + '" alt="' + escapeHtml(caption) + '" />';
                        if (caption && caption.trim()) {
                            imgHtml += '<figcaption class="article-image-caption">' + escapeHtml(caption) + '</figcaption>';
                        }
                        imgHtml += '</div>';
                        htmlParts.push(imgHtml);
                        break;
                    }
                    case 'alert':
                    case 'warning': {
                        var title = data.title || 'Внимание';
                        var message = data.message || '';
                        htmlParts.push(
                            '<div class="article-alert-card">' +
                                '<div class="article-alert-header">' +
                                    '<span class="article-alert-icon">⚠️</span>' +
                                    '<strong>' + escapeHtml(title) + '</strong>' +
                                '</div>' +
                                '<div class="article-alert-body">' + message + '</div>' +
                            '</div>'
                        );
                        break;
                    }
                    case 'embed': {
                        var embedUrl = data.embed || data.source || '';
                        var caption = data.caption || '';
                        htmlParts.push(
                            '<div class="article-embed-wrapper">' +
                                '<div class="article-embed-responsive">' +
                                    '<iframe src="' + escapeHtml(embedUrl) + '" frameborder="0" allowfullscreen loading="lazy"></iframe>' +
                                '</div>' +
                                (caption ? '<div class="article-embed-caption">' + escapeHtml(caption) + '</div>' : '') +
                            '</div>'
                        );
                        break;
                    }
                    case 'button': {
                        var btnText = data.text || 'Перейти';
                        var btnUrl = data.url || '#';
                        htmlParts.push(
                            '<div class="article-btn-wrapper">' +
                                '<a href="' + escapeHtml(btnUrl) + '" target="_blank" class="article-btn-cta">' + escapeHtml(btnText) + '</a>' +
                            '</div>'
                        );
                        break;
                    }
                    case 'spoiler':
                    case 'accordion': {
                        var title = data.title || 'Подробнее';
                        var content = data.content || '';
                        htmlParts.push(
                            '<details class="article-spoiler-card">' +
                                '<summary class="article-spoiler-header">' + escapeHtml(title) + '</summary>' +
                                '<div class="article-spoiler-content">' + content + '</div>' +
                            '</details>'
                        );
                        break;
                    }
                    case 'quote': {
                        var text = data.text || '';
                        var caption = data.caption || '';
                        htmlParts.push(
                            '<blockquote class="article-quote-block">' +
                                '<p>' + text + '</p>' +
                                (caption ? '<cite>' + escapeHtml(caption) + '</cite>' : '') +
                            '</blockquote>'
                        );
                        break;
                    }
                    case 'delimiter': {
                        htmlParts.push('<hr class="article-delimiter" />');
                        break;
                    }
                    case 'table': {
                        var content = data.content || [];
                        var withHeadings = data.withHeadings;
                        var tableHtml = '<div class="article-table-responsive"><table class="article-table">';
                        content.forEach(function(row, rIdx) {
                            tableHtml += '<tr>';
                            row.forEach(function(cell) {
                                var cellTag = (rIdx === 0 && withHeadings) ? 'th' : 'td';
                                tableHtml += '<' + cellTag + '>' + cell + '</' + cellTag + '>';
                            });
                            tableHtml += '</tr>';
                        });
                        tableHtml += '</table></div>';
                        htmlParts.push(tableHtml);
                        break;
                    }
                    case 'checklist': {
                        var items = data.items || [];
                        var clHtml = '<ul class="article-checklist-list">';
                        items.forEach(function(item) {
                            var checked = item.checked ? ' checked' : '';
                            clHtml += '<li class="article-checklist-item' + checked + '"><span class="checklist-box">' + (item.checked ? '☑' : '☐') + '</span> ' + (item.text || '') + '</li>';
                        });
                        clHtml += '</ul>';
                        htmlParts.push(clHtml);
                        break;
                    }
                    case 'raw': {
                        htmlParts.push(data.html || '');
                        break;
                    }
                    default: {
                        if (data.text) {
                            htmlParts.push('<p>' + data.text + '</p>');
                        }
                        break;
                    }
                }
            });

            return htmlParts.join('\n');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }
    </script>
</body>
